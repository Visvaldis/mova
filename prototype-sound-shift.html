<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Shift — Grimm's Law Explorer (prototype)</title>
<style>
  :root {
    --bg: #faf8fc;
    --card: #ffffff;
    --text: #1c1626;
    --muted: #6b6478;
    --accent: #7c3aed;       /* violet — sound topic */
    --accent-soft: #ede9fe;
    --accent-line: #c4b5fd;
    --shadow: 0 2px 12px rgba(60, 30, 120, .08);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14101c;
      --card: #1e1729;
      --text: #f0ecf7;
      --muted: #a79fb8;
      --accent: #a78bfa;
      --accent-soft: #2c2143;
      --accent-line: #5b4690;
      --shadow: 0 2px 14px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Inter", "Fixel", -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    padding: 24px 16px 64px;
    display: flex; flex-direction: column; align-items: center;
  }
  .wrap { width: 100%; max-width: 860px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 6px; }
  h1 { font-size: clamp(1.5rem, 4vw, 2.2rem); letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--muted); margin: 6px 0 26px; max-width: 60ch; line-height: 1.5; }
  .lang-toggle {
    display: flex; border: 1.5px solid var(--accent-line); border-radius: 999px; overflow: hidden; flex-shrink: 0;
  }
  .lang-toggle button {
    border: 0; background: transparent; color: var(--muted);
    padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .lang-toggle button.active { background: var(--accent); color: #fff; }

  .panel {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 22px; margin-bottom: 22px;
  }

  /* slider */
  .stage-labels { display: flex; justify-content: space-between; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .stage-labels span.on { color: var(--accent); }
  input[type=range] {
    width: 100%; accent-color: var(--accent); height: 28px; cursor: pointer;
  }
  .stage-note {
    text-align: center; color: var(--muted); font-size: .9rem; min-height: 2.6em; margin-top: 8px; line-height: 1.45;
  }

  /* word cards */
  .words { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 18px; }
  .word-card {
    background: var(--accent-soft); border-radius: 10px; padding: 14px 10px 10px; text-align: center;
    transition: opacity .3s, transform .3s;
  }
  .word-card.dim { opacity: .25; }
  .word-card.hit { transform: translateY(-3px); outline: 2px solid var(--accent); }
  .word {
    font-size: 1.45rem; font-weight: 700; letter-spacing: .01em; min-height: 1.4em;
    font-variant-numeric: tabular-nums;
  }
  .word .shift { color: var(--accent); display: inline-block; }
  .word .shift.pop { animation: pop .45s ease; }
  @keyframes pop {
    0% { transform: scale(.4) rotate(-8deg); opacity: 0; }
    60% { transform: scale(1.25); opacity: 1; }
    100% { transform: scale(1); }
  }
  .gloss { font-size: .74rem; color: var(--muted); margin-top: 6px; line-height: 1.4; }
  .ua-note { font-size: .72rem; color: var(--accent); margin-top: 2px; font-weight: 600; }

  /* try-it */
  h2 { font-size: 1.05rem; margin-bottom: 4px; }
  .hint { color: var(--muted); font-size: .85rem; margin-bottom: 12px; }
  .rules { display: flex; flex-wrap: wrap; gap: 8px; }
  .rules button {
    font: inherit; font-weight: 700; font-size: 1rem;
    padding: 8px 16px; border-radius: 999px; cursor: pointer;
    border: 1.5px solid var(--accent-line); background: transparent; color: var(--text);
    transition: background .2s;
  }
  .rules button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* diagram */
  .diagram-wrap { display: flex; justify-content: center; }
  svg { max-width: 420px; width: 100%; height: auto; }
  .node-box { fill: var(--accent-soft); stroke: var(--accent-line); stroke-width: 1.5; rx: 10; }
  .node-text { fill: var(--text); font-weight: 700; font-size: 17px; text-anchor: middle; }
  .node-sub { fill: var(--muted); font-size: 10.5px; text-anchor: middle; }
  .arrow { stroke: var(--accent); stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
  footer { color: var(--muted); font-size: .78rem; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-i18n="title"></h1>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button id="btn-en" onclick="setLang('en')">EN</button>
      <button id="btn-uk" onclick="setLang('uk')">УК</button>
    </div>
  </header>
  <p class="subtitle" data-i18n="subtitle"></p>

  <div class="panel">
    <div class="stage-labels">
      <span id="lbl0"></span><span id="lbl1"></span><span id="lbl2"></span>
    </div>
    <input type="range" id="slider" min="0" max="100" value="0"
           aria-label="Time slider from Proto-Indo-European to Modern English">
    <p class="stage-note" id="stageNote"></p>
    <div class="words" id="words"></div>
  </div>

  <div class="panel">
    <h2 data-i18n="tryTitle"></h2>
    <p class="hint" data-i18n="tryHint"></p>
    <div class="rules" id="rules"></div>
  </div>

  <div class="panel">
    <h2 data-i18n="chainTitle"></h2>
    <p class="hint" data-i18n="chainHint"></p>
    <div class="diagram-wrap">
      <svg viewBox="0 0 420 330" role="img" aria-labelledby="diagTitle">
        <title id="diagTitle">Grimm's Law chain shift diagram</title>
        <defs>
          <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L7,3 L0,6 Z" fill="var(--accent)"/>
          </marker>
        </defs>
        <!-- nodes -->
        <rect class="node-box" x="150" y="18"  width="120" height="56" rx="10"/>
        <text class="node-text" x="210" y="44">bʰ dʰ gʰ</text>
        <text class="node-sub"  x="210" y="62" id="d-asp"></text>

        <rect class="node-box" x="30" y="200" width="120" height="56" rx="10"/>
        <text class="node-text" x="90" y="226">b d g</text>
        <text class="node-sub"  x="90" y="244" id="d-voi"></text>

        <rect class="node-box" x="270" y="200" width="120" height="56" rx="10"/>
        <text class="node-text" x="330" y="226">p t k</text>
        <text class="node-sub"  x="330" y="244" id="d-vls"></text>

        <rect class="node-box" x="150" y="262" width="120" height="56" rx="10" style="stroke-dasharray:5 4"/>
        <text class="node-text" x="210" y="288">f θ h</text>
        <text class="node-sub"  x="210" y="306" id="d-fri"></text>

        <!-- arrows: aspirated -> voiced -> voiceless -> fricative -->
        <path class="arrow" d="M150,60 Q70,100 85,195"/>
        <path class="arrow" d="M155,235 L263,235"/>
        <path class="arrow" d="M325,262 Q300,290 277,290"/>
      </svg>
    </div>
  </div>
  <footer data-i18n="footer"></footer>
</div>

<script>
const I18N = {
  en: {
    title: 'The Sound <span>Shift</span> Machine',
    subtitle: "Around 500 BCE the ancestors of English rotated their entire consonant system — Grimm's Law. Drag the slider to watch 2,500 years of change hit six words at once.",
    stages: ['PIE / Latin', 'The shift fires', 'Modern English'],
    notes: [
      'The starting point: words as they sounded in Latin (a close stand-in for Proto-Indo-European).',
      'Grimm’s Law fires: only the affected consonants change — everything else stays put. (þ = the “th” sound)',
      'After 2,000 more years of smaller changes, the modern English words emerge.'
    ],
    tryTitle: 'Try a rule yourself',
    tryHint: 'Pick one consonant rule and see it fire across every word it applies to — sound laws have no exceptions.',
    chainTitle: 'The chain shift',
    chainHint: 'Three changes, one rotation: each consonant series moves one step. That’s why the system never collapsed into mush.',
    diag: { asp: 'breathy stops', voi: 'voiced stops', vls: 'voiceless stops', fri: 'fricatives (exit)' },
    footer: 'Prototype for the “sound-change” article · Movа / Tongue',
    glosses: { pater: 'father', tres: 'three', cornu: 'horn', piscis: 'fish', duo: 'two', dent: 'tooth' },
    uaKept: 'kept in Ukrainian:'
  },
  uk: {
    title: 'Машина звукових <span>зсувів</span>',
    subtitle: 'Близько 500 р. до н.е. предки англійської обернули всю свою систему приголосних — закон Ґрімма. Тягніть повзунок і дивіться, як 2 500 років змін б’ють по шести словах одночасно.',
    stages: ['ПІЄ / латина', 'Зсув спрацьовує', 'Сучасна англійська'],
    notes: [
      'Початкова точка: слова, як вони звучали в латині (близькій до праіндоєвропейської).',
      'Закон Ґрімма спрацьовує: змінюються лише відповідні приголосні — решта на місці. (þ = звук “th”)',
      'Після ще 2 000 років менших змін постають сучасні англійські слова.'
    ],
    tryTitle: 'Спробуйте правило самі',
    tryHint: 'Оберіть одне правило і подивіться, як воно спрацьовує в кожному слові, де застосовне, — звукові закони не мають винятків.',
    chainTitle: 'Ланцюговий зсув',
    chainHint: 'Три зміни, один оберт: кожна серія приголосних робить крок. Тому система не злиплась у кашу.',
    diag: { asp: 'придихові', voi: 'дзвінкі', vls: 'глухі', fri: 'фрикативи (вихід)' },
    footer: 'Прототип для статті “sound-change” · Мова / Tongue',
    glosses: { pater: 'батько', tres: 'три', cornu: 'ріг', piscis: 'риба', duo: 'два', dent: 'зуб' },
    uaKept: 'збережено в українській:'
  }
};

// Each word: 3 stages, each stage = list of [text, ruleId|null]
const WORDS = [
  { id: 'pater', ua: null, stages: [
      [['p','p>f'],['a',null],['t','t>θ'],['er',null]],
      [['f','p>f'],['a',null],['þ','t>θ'],['er',null]],
      [['f','p>f'],['a',null],['th','t>θ'],['er',null]] ] },
  { id: 'tres', ua: 'три', stages: [
      [['t','t>θ'],['rēs',null]],
      [['þ','t>θ'],['rēs',null]],
      [['th','t>θ'],['ree',null]] ] },
  { id: 'cornu', ua: null, stages: [
      [['c','k>h'],['ornu',null]],
      [['h','k>h'],['ornu',null]],
      [['h','k>h'],['orn',null]] ] },
  { id: 'piscis', ua: null, stages: [
      [['p','p>f'],['iscis',null]],
      [['f','p>f'],['iscis',null]],
      [['f','p>f'],['ish',null]] ] },
  { id: 'duo', ua: 'два', stages: [
      [['d','d>t'],['uo',null]],
      [['t','d>t'],['uo',null]],
      [['t','d>t'],['wo',null]] ] },
  { id: 'dent', ua: null, stages: [
      [['d','d>t'],['en',null],['t','t>θ'],['-',null]],
      [['t','d>t'],['an',null],['þ','t>θ'],['-',null]],
      [['t','d>t'],['oo',null],['th','t>θ'],['',null]] ] }
];

const RULES = ['p>f', 't>θ', 'k>h', 'd>t'];
const RULE_LABEL = { 'p>f':'p → f', 't>θ':'t → θ', 'k>h':'k → h', 'd>t':'d → t' };

let lang = (navigator.language || '').startsWith('uk') ? 'uk' : 'en';
let stage = 0;
let activeRule = null;

function stageFromSlider(v) { return v < 34 ? 0 : v < 67 ? 1 : 2; }

function renderWords(animate) {
  const box = document.getElementById('words');
  box.innerHTML = '';
  for (const w of WORDS) {
    const card = document.createElement('div');
    card.className = 'word-card';
    if (activeRule) {
      const applies = w.stages[0].some(seg => seg[1] === activeRule);
      card.classList.add(applies ? 'hit' : 'dim');
    }
    const word = document.createElement('div');
    word.className = 'word';
    for (const [text, rule] of w.stages[stage]) {
      const span = document.createElement('span');
      span.textContent = text;
      if (rule) {
        span.className = 'shift' + (animate ? ' pop' : '');
        if (activeRule && rule !== activeRule) span.style.opacity = .45;
      }
      word.appendChild(span);
    }
    const gloss = document.createElement('div');
    gloss.className = 'gloss';
    gloss.textContent = '“' + I18N[lang].glosses[w.id] + '”';
    card.appendChild(word); card.appendChild(gloss);
    if (w.ua) {
      const ua = document.createElement('div');
      ua.className = 'ua-note';
      ua.textContent = I18N[lang].uaKept + ' ' + w.ua;
      card.appendChild(ua);
    }
    box.appendChild(card);
  }
}

function renderRules() {
  const box = document.getElementById('rules');
  box.innerHTML = '';
  for (const r of RULES) {
    const b = document.createElement('button');
    b.textContent = RULE_LABEL[r];
    if (r === activeRule) b.classList.add('active');
    b.onclick = () => {
      activeRule = (activeRule === r) ? null : r;
      if (activeRule && stage === 0) {           // jump to "shift fires" so the rule is visible
        stage = 1; document.getElementById('slider').value = 50;
      }
      renderRules(); renderWords(true); renderStageText();
    };
    box.appendChild(b);
  }
}

function renderStageText() {
  const t = I18N[lang];
  ['lbl0','lbl1','lbl2'].forEach((id, i) => {
    const el = document.getElementById(id);
    el.textContent = t.stages[i];
    el.classList.toggle('on', i === stage);
  });
  document.getElementById('stageNote').textContent = t.notes[stage];
}

function setLang(l) {
  lang = l;
  document.documentElement.lang = l === 'uk' ? 'uk' : 'en';
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.getElementById('btn-uk').classList.toggle('active', l === 'uk');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.innerHTML = I18N[l][el.dataset.i18n];
  });
  const d = I18N[l].diag;
  document.getElementById('d-asp').textContent = d.asp;
  document.getElementById('d-voi').textContent = d.voi;
  document.getElementById('d-vls').textContent = d.vls;
  document.getElementById('d-fri').textContent = d.fri;
  renderStageText(); renderWords(false); renderRules();
}

document.getElementById('slider').addEventListener('input', e => {
  const s = stageFromSlider(+e.target.value);
  if (s !== stage) { stage = s; renderWords(true); renderStageText(); }
});

setLang(lang);
</script>
</body>
</html>
